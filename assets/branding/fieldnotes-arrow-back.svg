<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" role="img" aria-label="Back">
  <defs>
    <linearGradient id="shaft" x1="6" y1="14" x2="22" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="55%" stop-color="#e05697"/>
      <stop offset="100%" stop-color="#9b4dca"/>
    </linearGradient>
    <linearGradient id="head" x1="4" y1="8" x2="14" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="100%" stop-color="#e05697"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- soft disc -->
  <circle cx="14" cy="14" r="12" fill="#1a0a14" stroke="#e05697" stroke-opacity=".45" stroke-width="1"/>
  <g filter="url(#glow)">
    <!-- shaft -->
    <rect x="9" y="12.25" width="12" height="3.5" rx="1.75" fill="url(#shaft)"/>
    <!-- chevron head -->
    <path d="M12.5 7.5 L5.5 14 L12.5 20.5 L14.2 18.7 L9.2 14 L14.2 9.3 Z" fill="url(#head)"/>
  </g>
  <!-- tiny sakura notch accent on shaft tip -->
  <circle cx="20.5" cy="14" r="1.3" fill="#ffd6e8"/>
</svg>
