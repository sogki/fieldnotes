  - id: enka-showcase
    name: Enka.Network showcase
    status: documented_integration
    classification: community-maintained
    host: enka.network
    method: GET
    path: /api/uid/{uid}/
    query: [info]
    auth_required: false
    content_type: application/json
    purpose: Public character-showcase data for a UID, when that player has a populated showcase.
    data_returned: Not requested for any real UID. GET /api/uid/0/?info returned HTTP 400, which matches the documented "wrong UID format" code.
    potential_features:
      - Showcase viewer for a UID the user is allowed to query
      - Build snapshot display
    source: https://github.com/EnkaNetwork/API-docs/blob/master/api.md and one error-path GET on 2026-10-11.
    last_verified: 2026-10-11
    verification: documented_error_path_only
    restrictions: >
      Official Enka rules prohibit UID enumeration and bulk harvesting.
      Set a custom User-Agent. Honour the ttl field and HTTP 429.
      playerInfo is another person's account metadata; do not collect it for this repository.
    documented_status_codes:
      400: Wrong UID format
      404: Player does not exist
      424: Game maintenance or broken update
      429: Rate-limited
      500: General server error
      503: Service error

