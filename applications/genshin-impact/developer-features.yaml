    status: verified_integration
    classification: official-service
    host: webstatic.hoyoverse.com
    method: GET
    path: /admin/mi18n/plat_os/m09291531181441/m09291531181441-version.json
    auth_required: false
    content_type: application/json
    purpose: Small version file referenced by the local game log.
    data_returned: A version number. This check received {"version":16}.
    potential_features:
      - Cache-busting check for a known static text pack
    source: Hostname and path present in the local output_log.txt during the 2026-10-11 session, then fetched once.
    last_verified: 2026-10-11
    verification: http_200
    restrictions: Official static content. One observed file does not document the whole webstatic tree. Do not crawl arbitrary admin paths.
    sample_response:
      version: 16

  - id: dispatch-region-list
