  - id: genshin-dev-index
    name: genshin.dev entity index
    status: verified_integration
    classification: community-maintained
    host: genshin.jmp.blue
    method: GET
    path: /
    auth_required: false
    content_type: application/json
    purpose: Lists static entity types served by the fan-made API.
    data_returned: JSON object with a types array of ten names.
    potential_features:
      - Game-data browser navigation
    source: https://github.com/genshindev/api and a live GET on 2026-10-11.
    last_verified: 2026-10-11
    verification: http_200
    restrictions: Fan-made static data. The project states it does not interact with the game. Redistribution terms were not separately granted by this check.
    sample_request: GET https://genshin.jmp.blue/
    sample_response:
      types:
        - artifacts
        - boss
        - characters
        - consumables
        - domains
        - elements
        - enemies
        - materials
        - nations
        - weapons

  - id: genshin-dev-character
    name: genshin.dev character record
    status: verified_integration
    classification: community-maintained
    host: genshin.jmp.blue
    method: GET
    path: /characters/{id}
    query: [lang]
    auth_required: false
    content_type: application/json
    purpose: Static character profile, talents, constellations, and ascension materials.
    data_returned: One character object. Verified id ayaka.
    potential_features:
      - Character browser
      - Material calculator input
      - Build-tool reference data
    source: genshindev/api README and a live GET on 2026-10-11.
    last_verified: 2026-10-11
    verification: http_200
    restrictions: Optional lang parameter. Not all languages contain every field. Not account data.
    sample_request: GET https://genshin.jmp.blue/characters/ayaka?lang=en
    sample_response:
      name: Kamisato Ayaka
      title: Frostflake Heron
      vision: Cryo
      weapon: Sword
      nation: Inazuma
      rarity: 5

