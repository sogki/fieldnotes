    method: GET
    path: /query_region_list
    auth_required: unknown
    content_type: text/html
    purpose: Region-list URL present in the local game log.
    data_returned: HTTP 200 with a 16-character body, not a JSON document. Decoded form is 11 bytes and was not interpreted further.
    potential_features:
      - Region and server discovery, if the real client query shape were known
    source: output_log.txt during the 2026-10-11 session, plus one unauthenticated GET with no extra query.
    last_verified: 2026-10-11
