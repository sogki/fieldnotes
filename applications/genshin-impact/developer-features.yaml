    notes: This hostname was not tied to a specific TCP socket. DNS cache was empty and TLS names were not captured.

  - id: wish-history-page
    name: In-game Wish History page
    status: unavailable_or_restricted
    classification: official-service-undocumented
    host: gs.hoyoverse.com
    method: null
    path: /genshin/event/e20190909gacha-df01aea2/index.html
    auth_required: true
    content_type: null
    purpose: History webview URL written to the local game log when Wish History was opened.
    data_returned: Not fetched. Query parameter names included authkey, authkey_ver, sign_type, auth_appid, init_type, gacha_id, timestamp, lang, device_type, game_version, region, win_mode, and no_joypad_close. Values were not copied.
    potential_features:
      - Wish-history import, only with an authkey the account holder chooses to use
    source: output_log.txt tail at 2026-10-11 17:12:18Z, during a user-opened Wish History screen. Paimon.moe documents a later getGachaLog call that was not present in this log tail.
    last_verified: 2026-10-11
    verification: local_log_url_only
    restrictions: The authkey is a credential. Do not publish it or request the page with a captured key. This is not an official developer API.
    notes: A ZFGameBrowser process gained port-443 connections in the same minute, including 163.181.243.203 (AS24429, Zhejiang Taobao). That address was not resolved to this hostname.
    name: Wish history getGachaLog
    status: unavailable_or_restricted
    classification: official-service-undocumented
    host: public-operation-hk4e-sg.hoyoverse.com
    method: GET
    path: /gacha_info/api/getGachaLog
    auth_required: true
    content_type: application/json
    purpose: Paginated wish history for the in-game history page.
    data_returned: Not requested. Requires a short-lived authkey.
    potential_features:
      - Wish-history import, only with a key the account holder chooses to use
    source: MadeBaruna/paimon-moe import.svelte, reviewed 2026-10-10. Not live-tested.
    last_verified: 2026-10-10
    verification: source_only
    restrictions: Not a published third-party developer API. Do not extract, store, or transmit authkeys in Fieldnotes.

