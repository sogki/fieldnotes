# Developer-facing interfaces that could support community tools.
# Status values:
#   verified_integration       - tested within its permitted access model
#   documented_integration     - reliable documentation; not fully tested here
#   potential_integration      - evidence suggests usefulness; behaviour or permission not established
#   unavailable_or_restricted  - access not granted, gone, or not usable under current restrictions
#
# Samples contain no credentials, account identifiers, or session material.
# A reachable response is not a licence to redistribute the data.

catalogue: genshin-impact-developer-features
updated: 2026-10-11
game: Genshin Impact
publisher: COGNOSPHERE PTE. LTD.

entries:
  - id: official-game-data-api
    name: Official HoYoverse game-data developer API
    status: unavailable_or_restricted
    classification: official-developer-api
    host: null
    method: null
    path: null
    auth_required: null
